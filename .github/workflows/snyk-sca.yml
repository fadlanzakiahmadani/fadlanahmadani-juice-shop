
name: Snyk SCA Security Scan

on:
  push:
    branches:
      - main
      - develop
      - fix-vulnerability-tar
  pull_request:
    branches:
      - main

jobs:
  scan-root:
    name: Scan Root Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Scan root dependencies
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  scan-frontend:
    name: Scan Frontend Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Scan frontend dependencies
        run: snyk test --severity-threshold=high
        working-directory: frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  monitor:
    name: Snyk Monitor
    runs-on: ubuntu-latest

    needs:
      - scan-root
      - scan-frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scan-root.result == 'success' && needs.scan-frontend.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Monitor root dependencies
        run: snyk monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Monitor frontend dependencies
        run: snyk monitor
        working-directory: frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
